- insert:
    - id: enderwriter
      name: '@local/enderwriter'
      config:
        # 留空 = 自动探测：插件会依次尝试同级的 enderwriter/ 目录、EW_ROOT
        # 环境变量、以及当前工作目录下的 enderwriter/。克隆本仓库后通常无需修改。
        root: ''
        # 留空 = 自动探测：EW_PYTHON → DSH 自带运行时 → PATH 上的 python
        python: ''
        defaultBudget: 800
