- insert:
    - id: enderwriter
      name: 'dsh-enderwriter'
      config:
        # 留空 = 自动探测包根（寻找包含 enderwriter/bridge.py 的目录）
        root: ''
        # 留空 = 自动探测 python（优先 PATH，其次常见安装位置）
        python: ''
        defaultBudget: 800
        # 总开关：false 时不注册任何工具与面板
        enabled: true
        # work 留空 = 每个对话一套独立记忆（默认）。
        # 想让多个对话共享同一部作品的设定时，填作品名，例如：
        #   work: '长篇第一卷'
        work: ''
