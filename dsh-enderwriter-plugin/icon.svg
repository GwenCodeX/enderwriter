<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="EnderWriter">
  <title>EnderWriter 末影箱</title>
  <!-- 箱体 -->
  <rect x="8" y="24" width="48" height="32" rx="4" fill="#2b2140"/>
  <rect x="8" y="24" width="48" height="32" rx="4" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <!-- 箱盖 -->
  <path d="M8 24 L14 12 H50 L56 24 Z" fill="#3d2f5c" stroke="#a78bfa" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 锁扣 -->
  <rect x="27" y="30" width="10" height="12" rx="2" fill="#c4b5fd"/>
  <circle cx="32" cy="36" r="2" fill="#2b2140"/>
  <!-- 从箱中溢出的记忆微粒（伏笔与设定） -->
  <circle cx="20" cy="16" r="2" fill="#c4b5fd"/>
  <circle cx="32" cy="9" r="2.6" fill="#ddd6fe"/>
  <circle cx="44" cy="16" r="2" fill="#c4b5fd"/>
  <path d="M32 4 V1" stroke="#ddd6fe" stroke-width="2" stroke-linecap="round"/>
</svg>
